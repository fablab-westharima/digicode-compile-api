sentence=Layer 5 wheeled rover API for DigiCode robotics. Dual-mode (continuous-rotation servo 2-pin / DC motor H-bridge 4-pin) ground rover driven through DigiMotion.
paragraph=Provides DigiRover class with initServoMode (2-pin continuous-rotation servos) or initDcMotorMode (4-pin H-bridge DC motors, previously unreachable from the legacy library). Velocity commands forward / backward / turnLeft / turnRight / spinLeft / spinRight / stop. isMoving query. Per-channel 3-axis settings via DigiMotion IActuatorChannel. Original implementation; not derived from OttoDIY/OttoDIYLib or any other GPL upstream.
