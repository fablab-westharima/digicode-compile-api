name=DigiMotion
version=1.0.0
author=DigiCo LLC
maintainer=DigiCo LLC <info@digico.jp>
sentence=Foundation library for DigiCode robotics (Layer 0-4): actuator abstraction, background pump, motion primitives, NVS trim store, sound/gesture.
paragraph=Provides IActuatorChannel abstraction (servo 180/270 / continuous servo / stepper polling+HW / DC motor) with unified pulse+speed+trim 3-axis settings, IBackgroundPump (FreeRTOS-backed on ESP32, abstract IF for future RP2040 portability), ChannelBank phase-sync coordination, SineOscillator + LinearInterpolator motion primitives, NVS-backed TrimStore, DigiBuzzer + GestureLibrary. Foundation for DigiBiped / DigiMorpher / DigiRover (Layer 5). Original implementation; not derived from OttoDIY/OttoDIYLib or any other GPL upstream.
category=Device Control
url=https://github.com/fablab-westharima/digicode-compile-api
architectures=esp32
license=AGPL-3.0-or-later
depends=ESP32Servo
