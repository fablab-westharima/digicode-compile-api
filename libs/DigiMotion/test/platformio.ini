; DigiMotion host-side unit test config (Phase A-β skeleton + A-γ pump tests)
;
; Run individual tests:
;   pio test -e native -f test_hello
;   pio test -e native -f test_pump
;
; Native env = host machine, no MCU. Used for pure-logic verification of
; channel rate caps, trim application, pump scheduling, oscillator math,
; etc. ESP32-specific source files (*_esp32.cpp) are guarded with
; #ifdef ARDUINO_ARCH_ESP32 and compile to empty translation units here.
;
; src_dir = ../src and the -I../src include flag together expose the lib
; source so tests can #include "pump/IBackgroundPump.h" etc. directly.

[platformio]
test_dir = .
src_dir = ../src

[env:native]
platform = native
test_framework = googletest
build_flags = -std=gnu++17 -I../src
