; DigiMotion host-side unit test config (Phase A-β + A-γ commits 1-3)
;
; Run individual tests:
;   pio test -e native -f test_hello
;   pio test -e native -f test_pump
;   pio test -e native -f test_actuator_channels
; Or all together:
;   pio test -e native -f test_hello -f test_pump -f test_actuator_channels
;
; Native env = host machine, no MCU. Used for pure-logic verification of
; channel rate caps, trim application, pump scheduling, oscillator math,
; etc. ESP32-specific source files (*_esp32.cpp) and ESP32 HW members
; inside #ifdef ARDUINO_ARCH_ESP32 in channel headers compile to empty
; translation units here.
;
; src_dir = ../src and the -I../src include flag together expose the lib
; source so tests can #include "pump/IBackgroundPump.h",
; "actuator/ServoChannel180.h", etc. directly.
;
; Platform abstraction gate (Phase A-γ commit 3) — run separately before
; every commit that touches the lib:
;   bash ../tools/check-platform-abstraction.sh
; The script enforces 59.md §1.0.1 + D-new-2 rules across the src/ tree
; (Layer 2 FreeRTOS-task-free, Layer 3+ ESP32-API-free). Not auto-hooked
; into PIO test because the test binary's working directory is the build
; cache, not the lib root, making relative paths fragile. CI / pre-commit
; hooks invoke it independently.

[platformio]
test_dir = .
src_dir = ../src

[env:native]
platform = native
test_framework = googletest
; Layer 5 robot libs (DigiBiped/DigiMorpher/DigiRover, Phase A-ε commit 2)
; live in sibling lib dirs and are header-inline. Their headers include
; <actuator/IActuatorChannel.h> etc. which resolve via -I../src (the
; DigiMotion src root). Adding -I../../<LibName>/src lets test_biped /
; test_morpher / test_rover do `#include "DigiBiped.h"` etc. The robot
; lib's thin .cpp is NOT linked into the test binary; the inline header
; impl is sufficient since all methods are inline.
build_flags = -std=gnu++17 -I../src -I../../DigiBiped/src -I../../DigiMorpher/src -I../../DigiRover/src
; test_build_src = true compiles src/**/*.cpp into the test binary so Layer
; 3-4 motion primitives (Phase A-δ: ChannelBank/SineOscillator/LinearInter-
; polator) split as .h + .cpp link correctly. Inline header-only files
; (Layer 1 IBackgroundPump + Layer 2 channel headers) are unaffected; the
; ESP32-only FreeRtosBackgroundPump_esp32.cpp compiles to an empty TU on
; native (full body inside #ifdef ARDUINO_ARCH_ESP32).
test_build_src = true
; test_ignore = .pio/* prevents PIO test discovery from re-matching the
; per-test build artifacts under .pio/build/native/test/test_*/ as if they
; were source test directories. Without this, an unfiltered run like
; `pio test -e native` (no -f flag) reports each test twice with the
; second copy ERRORED. The canonical filtered form is unaffected.
test_ignore = .pio/*
