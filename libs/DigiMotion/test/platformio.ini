; DigiMotion host-side unit test config (Phase A-beta skeleton)
;
; Run: pio test -e native -f hello_test
;
; Native env = host machine, no MCU. Used for pure-logic verification of
; channel rate caps, trim application, pump scheduling, oscillator math,
; etc. Implementation lands in Phase A-gamma onward (see
; plans/active/60_robotics-redesign-implementation-plan.md).

[env:native]
platform = native
test_framework = googletest
build_flags = -std=gnu++17

[platformio]
test_dir = .
