sentence=Layer 5 transformable robot API for DigiCode robotics. Dual-mode (walk / roll) physical-transformation robot driven through DigiMotion ChannelBank.
paragraph=Provides DigiMorpher class with setMode (MORPH_WALK / MORPH_ROLL), shiftBlocking + shiftAsync (physical transformation between modes), walkBlocking + walkAsync / turnBlocking + turnAsync (walk mode), rollBlocking + rollAsync / rollRotateBlocking + rollRotateAsync (roll mode), pushupBlocking + pushupAsync, danceBlocking + danceAsync, homeBlocking, stop, isIdle / waitUntilIdle. Per-channel 3-axis settings via DigiMotion IActuatorChannel. Original implementation; not derived from OttoDIY/OttoDIYLib or any other GPL upstream.
