name=DigiBiped
version=1.0.0
author=DigiCo LLC
maintainer=DigiCo LLC <info@digico.jp>
sentence=Layer 5 biped robot API for DigiCode robotics. 4-servo humanoid (LEFT_LEG / RIGHT_LEG / LEFT_FOOT / RIGHT_FOOT) driven through DigiMotion ChannelBank + SineOscillator. Blocking + async motion split per D8 design discipline.
paragraph=Provides DigiBiped class with motion APIs walkBlocking + walkAsync, turnBlocking + turnAsync, jumpBlocking + jumpAsync, dance / swing / bend / moonwalk (each Blocking + Async pair), homeBlocking / homeAsync, isIdle / waitUntilIdle. Per-channel 3-axis settings (setChannelPulseRange / setChannelMaxRate / setChannelTrim) forward to the underlying IActuatorChannel for case 23 incident A uniform reflection. Original implementation; not derived from OttoDIY/OttoDIYLib or any other GPL upstream. Motion patterns (amplitude / phase per channel per motion) are new numerical designs distinct from Otto::walk's hardcoded arrays.
category=Device Control
