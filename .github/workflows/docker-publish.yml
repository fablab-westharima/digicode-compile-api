name: Build and Publish Docker Image

# Push to main → build the compile-api image and push to ghcr.io.
# All pushes trigger a build (this repo IS the compile-api). Concurrency
# cancels stale builds when a newer push arrives.
on:
  push:
    branches:
      - main

# Cancel in-flight builds for the same ref when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/fablab-westharima/digicode-compile-api
  DOCKERHUB_IMAGE: docker.io/digicollc/digicode-compile-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # amendment 9 (2026-05-07, post-fail commit): warmup-pio.ts bakes 3 PIO
      # target persistent projects (~3-4 GB) into the image at build time, so
      # the runtime first compile per (board × template) is ~30s instead of
      # ~5 min cold (Stage D v2 max 509s, BUG-078 第84回). The first attempt
      # at amendment 9 (commit 1e64d9c, run #36) ran out of disk during
      # `Build and push Docker image` export — Annotation:
      #   "System.IO.IOException: No space left on device :
      #    '/home/runner/actions-runner/_extracted/_diag/...'"
      # ubuntu-latest's ~14 GB free disk + GHA cache mode=max + amendment 9
      # image growth + build context tmp files put us over the cliff.
      # warmup-pio itself completed fine (7/7 targets baked in 57.3 min).
      #
      # jlumbroso/free-disk-space removes preinstalled runner tooling
      # (Android SDK ~14 GB, .NET, Haskell, CodeQL, preinstalled docker
      # images, swap) for ~28-30 GB total freed. Widely adopted across the
      # GH Actions ecosystem; safe for our build (we don't use Android /
      # .NET / Haskell; the docker daemon stays, only its preinstalled
      # images go).
      - name: Free disk space (amendment 9 build context)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub login for the post-build mirror step (see below).
      # The login-action authenticates the host docker daemon (not just
      # buildx), so the subsequent `docker push` uses the standard pusher
      # via the system socket — exactly the same code path the legacy
      # mini-PC `docker push` script used (per archived 2026-04-10
      # `07_DockerHubアップデート手順.md`).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v0.1.0
            type=sha,prefix=main-,format=short

      - name: Build and push Docker image (ghcr.io canonical)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest (ghcr.io)
        run: echo "ghcr.io image digest = ${{ steps.build.outputs.digest }}"

      # Mirror to Docker Hub via the host docker daemon (S1 fix, 2026-05-08).
      #
      # Why a separate step (and not docker/build-push-action's multi-image
      # `images:` list):
      #   docker/build-push-action runs through buildkit/buildx which
      #   defaults to a *monolithic* PUT for blob upload (single HTTP
      #   request carrying the entire layer). Docker Hub's registry-1
      #   endpoint sits behind Cloudflare with a 100 MB request body cap.
      #   The warmup-pio.ts result is a single ~2.97 GB layer, so the
      #   monolithic PUT trips Cloudflare → returns the default 400 page
      #   (`<html><body><h1>400 Bad request</h1>...`). Verified across 3
      #   attempts (run ids 25508150506 / 25508705431 / 25509860068);
      #   provenance/sbom toggles did not help because the upload itself
      #   never reached the registry.
      #
      # The legacy mini-PC procedure (archived 2026-04-10) used standalone
      # `docker push`, which performs *chunked* upload by default —
      # Cloudflare receives many ≤100 MB PATCH chunks instead of one
      # 2.97 GB PUT, and the upload completes. We replicate that here on
      # the runner: pull from ghcr.io (already pushed above) into the
      # host docker daemon, retag, push to Docker Hub via the same
      # chunked path the mini-PC used.
      #
      # The mirror copies the byte-identical image — same digest as
      # ghcr.io, just a different repo name. This is intentional: it
      # guarantees ML30 (cloud, ghcr.io) and end-user local installs
      # (Docker Desktop, Docker Hub) run the same compile output, no
      # version drift.
      - name: Mirror ghcr.io image to Docker Hub
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          GHCR_TAG="${{ env.GHCR_IMAGE }}:main-${SHA_SHORT}"
          DH_TAG_SHA="${{ env.DOCKERHUB_IMAGE }}:main-${SHA_SHORT}"
          DH_TAG_LATEST="${{ env.DOCKERHUB_IMAGE }}:latest"

          echo "Pulling ${GHCR_TAG} into host docker daemon..."
          docker pull "${GHCR_TAG}"

          echo "Retagging for Docker Hub..."
          docker tag "${GHCR_TAG}" "${DH_TAG_SHA}"
          docker tag "${GHCR_TAG}" "${DH_TAG_LATEST}"

          echo "Pushing to Docker Hub (chunked upload via host docker daemon)..."
          docker push "${DH_TAG_SHA}"
          docker push "${DH_TAG_LATEST}"

          echo "Mirror complete:"
          echo "  ghcr.io   = ${GHCR_TAG}"
          echo "  docker.io = ${DH_TAG_SHA}"
          echo "  docker.io = ${DH_TAG_LATEST}"
